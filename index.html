<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2rit</title>
<meta name="description" content="รวมลิงก์ช่อง 2rit">
<meta property="og:type" content="website">
<meta property="og:title" content="2rit">
<meta property="og:description" content="รวมลิงก์ช่อง 2rit">
<meta property="og:url" content="https://2rit.github.io/">
<meta property="og:image" content="https://2rit.github.io/og.PNG">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://2rit.github.io/og.PNG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Prompt:wght@600;800&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">

<script>
/* ============================================================
   ส่วนที่แก้ได้เอง: แก้เฉพาะข้อความในเครื่องหมายคำพูด " "
   ห้ามลบเครื่องหมายคำพูด และห้ามลบจุลภาค (,) ท้ายบรรทัด
   ============================================================ */
const SITE = {
  // ชื่อช่อง (ตัวใหญ่ด้านบน จะแสดงเป็นตัวพิมพ์ใหญ่อัตโนมัติ)
  name: "2rit",

  // คำโปรยในแถบเขียว (แก้เป็นของคุณได้เลย)
  tagline: "ช่องหลักของ 2rit รวมทุกช่องทางไว้ที่นี่",

  // ข้อความท้ายหน้า
  footer: "© 2rit",

  // รายการลิงก์ (1 บล็อก { } = 1 ปุ่ม)
  // title = ชื่อปุ่ม, note = คำอธิบายเล็ก, url = ลิงก์จริง
  // อยากเพิ่มปุ่ม: คัดลอกบล็อก { } ทั้งก้อนไปวางต่อท้าย
  // อยากลบปุ่ม: ลบบล็อก { } ทั้งก้อน
  links: [
    { title: "YouTube", note: "ช่องหลัก ดูคลิปทั้งหมด", url: "https://www.youtube.com/@2ritS" },
    { title: "TikTok", note: "คลิปสั้น", url: "https://www.tiktok.com/@2rit.tk" },
    { title: "Instagram", note: "ภาพและเบื้องหลัง", url: "https://www.instagram.com/2rit.ig" },
    { title: "Facebook", note: "เพจ", url: "https://www.facebook.com/2rit.fb" },
    { title: "Email", note: "แตะเพื่อคัดลอกอีเมล", url: "mailto:2rit.iq@gmail.com" }
  ]
};
/* ==================== จบส่วนที่แก้ได้ ==================== */
</script>

<style>
:root {
  --forest: #12301f;
  --green: #2f7a4b;
  --cream: #f6f0e0;
  --cream-deep: #ebe3cc;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  min-height: 100%;
  background: var(--cream);
  color: var(--forest);
  font-family: "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.5;
  overflow-x: hidden;
}
.stage { max-width: 480px; margin: 0 auto; padding: 28px 20px 40px; }

/* ชื่อช่อง: ตัวหนาใหญ่เต็มจอ */
h1 {
  font-family: "Anton", "Prompt", Impact, sans-serif;
  font-weight: 400;
  text-transform: uppercase;
  font-size: clamp(6rem, 38vw, 10rem);
  line-height: .85;
  letter-spacing: -0.01em;
  margin: 0;
  color: var(--forest);
}

/* แถบคำโปรย: เขียวเข้ม เอียงเล็กน้อย */
.band {
  display: inline-block;
  margin: 18px 0 0 -8px;
  padding: 10px 18px;
  background: var(--green);
  color: var(--cream);
  font-family: "Prompt", "Noto Sans Thai", sans-serif;
  font-weight: 800;
  font-size: 1.05rem;
  line-height: 1.3;
  transform: rotate(-2deg);
  box-shadow: 5px 5px 0 var(--forest);
}

/* ลิงก์: บล็อกขอบหนา เงาแข็ง กดแล้วสลับสี */
ul { list-style: none; margin: 40px 0 0; padding: 0; display: grid; gap: 18px; }
.card {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 12px;
  min-height: 76px;
  padding: 14px 18px;
  background: var(--cream);
  color: var(--forest);
  text-decoration: none;
  border: 3px solid var(--forest);
  box-shadow: 6px 6px 0 var(--forest);
  transition: transform .12s ease, box-shadow .12s ease, background-color .12s ease, color .12s ease;
}
.card .name {
  font-family: "Prompt", "Noto Sans Thai", sans-serif;
  font-weight: 800;
  font-size: 1.35rem;
  line-height: 1.15;
  text-transform: uppercase;
  display: block;
}
.card .note { font-weight: 600; font-size: .95rem; opacity: .8; }
.card .go {
  font-family: "Prompt", "Noto Sans Thai", sans-serif;
  font-weight: 800;
  font-size: .95rem;
  padding: 6px 12px;
  background: var(--forest);
  color: var(--cream);
  white-space: nowrap;
}
.card:hover, .card:active {
  background: var(--green);
  color: var(--cream);
  transform: translate(4px, 4px);
  box-shadow: 2px 2px 0 var(--forest);
}
.card:hover .go, .card:active .go { background: var(--cream); color: var(--forest); }
.card:focus-visible { outline: 3px solid var(--green); outline-offset: 4px; }

footer {
  margin-top: 44px;
  padding-top: 14px;
  border-top: 3px solid var(--forest);
  font-weight: 600;
  font-size: .9rem;
}

@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
}
</style>
</head>
<body>
<div class="stage">
  <header>
    <h1 id="name"></h1>
    <div class="band" id="tagline"></div>
  </header>
  <main><ul id="links"></ul></main>
  <footer id="footer"></footer>
</div>

<script>
/* ส่วนนี้สร้างหน้าเว็บจากข้อมูลด้านบน ไม่ต้องแก้ */
document.title = SITE.name;
document.getElementById("name").textContent = SITE.name;
document.getElementById("tagline").textContent = SITE.tagline;
document.getElementById("footer").textContent = SITE.footer;
const list = document.getElementById("links");
function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(t);
  }
  return new Promise(function (ok, fail) {
    const ta = document.createElement("textarea");
    ta.value = t;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand("copy") ? ok() : fail(); } catch (e) { fail(e); }
    document.body.removeChild(ta);
  });
}
SITE.links.forEach(function (l) {
  const isMail = l.url.indexOf("mailto:") === 0;
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.className = "card";
  a.href = l.url;
  if (!isMail) {
    a.target = "_blank";
    a.rel = "noopener";
  }
  const text = document.createElement("span");
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = l.title;
  const note = document.createElement("span");
  note.className = "note";
  note.textContent = isMail ? l.url.replace("mailto:", "") : l.note;
  text.append(name, note);
  const go = document.createElement("span");
  go.className = "go";
  go.textContent = isMail ? "คัดลอก" : "เข้าชม";
  if (isMail) {
    a.addEventListener("click", function (e) {
      e.preventDefault();
      copyText(l.url.replace("mailto:", "")).then(function () {
        go.textContent = "คัดลอกแล้ว";
      }, function () {
        go.textContent = "กดค้างที่อีเมลเพื่อคัดลอก";
      }).then(function () {
        setTimeout(function () { go.textContent = "คัดลอก"; }, 2000);
      });
    });
  }
  a.append(text, go);
  li.append(a);
  list.append(li);
});
</script>
</body>
</html>
